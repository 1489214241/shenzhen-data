	function getBoundary() {
		if (borderpoints != undefined && borderpoints.length > 0) {
			var ps = [];
			var cen = map.getCenter();
			var ps_up = [];
			var ps_down = [];
			var point1 = new BMap.Point(110.461876,20.611113);
			ps_up.push(point1);			
			var point2 = new BMap.Point(110.461876,24.0182);
			ps_up.push(point2);			
			var point3 = new BMap.Point(116.786481,24.175636);
			ps_up.push(point3);			
			var point4 = new BMap.Point(116.786481,20.611113);
			ps_up.push(point4);			
			var point5 = new BMap.Point(110.461876,20.611113);
			ps_up.push(point5);			
			for (var i = 0; i < borderpoints.length; i++) {
				var point = new BMap.Point(borderpoints[i].x, borderpoints[i].y);
				var point1 = new BMap.Point(borderpoints[borderpoints.length-i-1].x, borderpoints[borderpoints.length-i-1].y);
				ps.push(point);
				ps_up.push(point);
				if(i < 1 ||i > borderpoints.length-2)	{
					ps_down.push(point);
				}										
			}
			ps_down.push(point5);
			spolygon = new BMap.Polygon(ps, {
				strokeColor : "red",
				strokeWeight : 5,
				strokeOpacity : 1,
				fillColor : "white",
				fillOpacity : 0.001
			});
			map.addOverlay(spolygon);
			var spolygon1 = new BMap.Polygon(ps_up,{ strokeColor: "none", fillColor: "rgb(246,246,246)", strokeOpacity:1,fillOpacity:1}); //建立多边形覆盖物
			map.addOverlay(spolygon1);
			var spolygon2 = new BMap.Polygon(ps_down,{ strokeColor: "none", fillColor: "rgb(246,246,246)", strokeOpacity:1,fillOpacity:1}); //建立多边形覆盖物
			map.addOverlay(spolygon2);			
			//上113.461876,23.0182 114.786481,23.175636 下 113.312398,22.148997 114.956656,22.211113
		}
	}
	function otherotherxx() {
		for (var i = 0; i < otherxx.length; i++) {
			var label = new BMap.Label((otherxx[i].XH||"")+(otherxx[i].MC||""), {offset: new BMap.Size( 10, 25)});			//创建气球下方名称标签
		    label.setStyle({borderColor: "gray",color: "green"});		    
			var spointtemp = new BMap.Point(otherxx[i].POINTX, otherxx[i].POINTY);
			var smarkertemp = new BMap.Marker(spointtemp);
			smarkertemp.setLabel(label);
			map.addOverlay(smarkertemp);
			var ps = [];
			var borderpointstemp = eval(otherxx[i].MAPDATA);
			for (var j = 0; j < borderpointstemp.length; j++) {
				var point = new BMap.Point(borderpointstemp[j].x, borderpointstemp[j].y);
				ps.push(point);
			}
			var plyname = "polygon" + i;
			ply_event(plyname, ps, i);
		}
	}
	function ply_event(plyname, zps, i) {		
	    plyname = new BMap.Polygon(zps, {
			strokeColor : "red",
			strokeWeight : 3.3,
			strokeOpacity : 1,
			fillColor : "white",
			fillOpacity : 0.001,
			strokeStyle : "dashed"
		});
		map.addOverlay(plyname);
		plyname.addEventListener("mouseover", function() {
			w = i;
		});
		plyname.addEventListener("mousemove", function() {
			w = i;
		});
		plyname.addEventListener("mouseout", function() {
			w = -1;
		});
	}

					text += "<a href='javascript:void(0);' onclick='add_ply_find(\"" + otherxx[i].ORG_ID + "\")'><font size='3' color='red'>" + otherxx[i].MC + "</font></a>&nbsp;&nbsp;";
					len++;
					if (first == -1) {
						first = otherxx[i].ORG_ID;
					}
				}
			}
		} else if(TYPE == 2){
				$.ajaxUrl({
					url : "zs_xqfdzfwhf/open/doWxyhfList",
					data : {
						"FWBM" : str
					},
					callback : function(data) {
						searchdata = (data.datas == undefined || data.datas == "" || data.datas == null) ? "." : data;
						if (searchdata != ".") {
							for (var i = 0; i < otherxx.length; i++) {									
								for (var j = 0; j < searchdata.datas.length; j++) {									
									if (otherxx[i].ORG_ID == searchdata.datas[j].XXID) {
										console.log(otherxx[i].ORG_ID);
										text += "<a href='javascript:void(0);' onclick='add_ply_find(\"" + otherxx[i].ORG_ID + "\")'><font size='3' color='red'>" + otherxx[i].MC + "</font></a>&nbsp;&nbsp;";
										len++;
										if (first == -1) {
											first = otherxx[i].ORG_ID;
										}
									}
								}
							}
						}
					}	
			})			
		}else if (TYPE == 1){			
			var type = 0;
			for (var i = 0; i < otherxx.length; i++) {
				if (len < 5 && otherxx[i].XQ && otherxx[i].XQ.indexOf(str) >= 0) {
					var arr_search = otherxx[i].XQ.split(";");
					for (var j = 0; j < arr_search.length; j++) {
						if (arr_search[j].indexOf(str) >= 0) {
							text += "<a href='javascript:void(0);' onclick='add_ply_find(\"" + otherxx[i].ORG_ID + "\")'><font size='3' color='red'>" + otherxx[i].MC + "</font></a>&nbsp;&nbsp;";
							len++;
							//searchxx += otherxx[i].ORG_ID + ",";
							if (first == -1) {
								first = otherxx[i].ORG_ID;
							}
						}
					}
				}
			}
		}
		if (len == 0) {
			text += "<font size='3' color='red'>未搜索到相关结果！</font>";
		} else if (len >= 5) {
			text += "<font size='3' color='red'>(搜索结果过多,请输入准确名称)</font>";
		}
		s_result.html(text);
		if (len != 0) {
			add_ply_find(first);
		}
	}
     
	//给搜索到的学校区域添加ply_find覆盖物并移至视界中心
	function add_ply_find(ORG_ID) {
		var num = -1;
		map.removeOverlay(ply_temp);
		map.removeOverlay(lab_temp);
		for (var i = 0; i < otherxx.length; i++) {
			if (ORG_ID == otherxx[i].ORG_ID) {
				num = i
			}
		}
		if (num != -1) {
			var ps = [];
			var borderpointstemp = eval(otherxx[num].MAPDATA);
			for (var j = 0; j < borderpointstemp.length; j++) {
				var point = new BMap.Point(borderpointstemp[j].x, borderpointstemp[j].y);
				ps.push(point);
			}
			var ply_move = new BMap.Polygon(ps, {
				strokeColor : "",
				strokeWeight : 1.3,
				strokeOpacity : 1,
				fillColor : "#FFFF00",
				fillOpacity : 0.3,
				strokeStyle : "dashed"
			});
			map.addOverlay(ply_move);
			ply_temp = ply_move;
			//x=num;		
			map.removeOverlay(lab_temp);
			var xqbh = "";
			if (otherxx[num].XM) {
				xqbh = "<font size='7' color='orange'>" + otherxx[num].XM + "</font><br/>";
			}
			var labeltext = xqbh + otherxx[num].MC;
			var lab_move = new BMap.Label(labeltext, {
				//offset : new BMap.Size(-60, 20)
			});
			var center_find = new BMap.Point(otherxx[num].POINTX, otherxx[num].POINTY);
			lab_move.setPosition(center_find);
			map.addOverlay(lab_move);
			lab_temp = lab_move;
			map.centerAndZoom(center_find, 15);
		}
	}
