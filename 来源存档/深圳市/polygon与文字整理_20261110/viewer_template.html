<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>深圳四区 · 学区边界与文字</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#183042;background:#eef2f5;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#143547;color:white;padding:22px 28px}h1{font-size:23px;margin:0 0 8px;font-weight:650}header p{margin:0;color:#d6e5ec;line-height:1.8}.toplinks{margin-top:12px;display:flex;gap:20px;flex-wrap:wrap}.toplinks a{color:#bce7e0}a{color:#006b78;overflow-wrap:anywhere}.stats{display:flex;gap:12px;padding:16px 24px;flex-wrap:wrap}.stat{background:white;border:1px solid #dce4e9;padding:10px 16px;border-radius:8px;flex:1;min-width:220px}.stat b{font-size:20px;margin-right:8px}.stat small{display:block;color:#607582;margin-top:5px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:0 24px 24px}.sidebar,.panel{background:white;border:1px solid #dce4e9;border-radius:10px;overflow:hidden}.filters{padding:14px;border-bottom:1px solid #e1e7eb}input,select,button{font:inherit}input[type=search],select{width:100%;padding:10px;border:1px solid #c3d0d9;border-radius:6px;background:#fff;color:#183042;margin-bottom:8px}input:focus,select:focus,button:focus-visible{outline:2px solid #008877;outline-offset:2px}.count{font-size:12px;color:#607582}.list{height:calc(100vh - 370px);min-height:320px;overflow:auto}.school{width:100%;border:0;border-bottom:1px solid #ecf0f2;text-align:left;background:white;padding:13px 14px;cursor:pointer;color:#183042;line-height:1.5}.school:hover{background:#f2f8f8}.school.active{background:#e2f3ef;border-left:4px solid #008877;padding-left:10px}.school small{display:block;color:#607582;margin-top:4px}.details{min-width:0}.heading{padding:18px 20px;background:white;border:1px solid #dce4e9;border-radius:10px;margin-bottom:12px}h2{font-size:20px;line-height:1.5;margin:0 0 7px}.meta{color:#607582;font-size:12px;line-height:1.8;overflow-wrap:anywhere}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.badge{background:#e7f3ef;color:#226655;padding:4px 8px;border-radius:4px;font-size:12px}.badge.warn{background:#fff0da;color:#825a17}.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.panel h3{font-size:15px;margin:0;padding:13px 16px;border-bottom:1px solid #e3e9ed}.maptools{padding:12px 14px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.mapbox{background:#f8fafb;margin:0 10px;border:1px solid #e5ecef;border-radius:6px}svg{width:100%;height:390px;display:block}.caption{padding:12px 16px;color:#607582;font-size:12px;line-height:1.8}.textbody{padding:16px;max-height:650px;overflow:auto}.section{margin-bottom:22px}.section h4{margin:0 0 9px;font-size:14px;color:#214f61}.scope{white-space:pre-wrap;line-height:1.85;overflow-wrap:anywhere;background:#f7f9fa;padding:12px;border-radius:6px;margin-bottom:8px}.missing{color:#9a640c}.source{font-size:12px;line-height:1.8;color:#607582}.notes{padding:14px 18px;margin-top:12px;line-height:1.8;background:#fffaf0;border:1px solid #ecdfc3;border-radius:8px;font-size:13px}.empty{padding:25px;color:#607582}.legend{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}.downloads{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap}.downloads button{border:1px solid #bfcfd6;border-radius:5px;background:#fff;color:#006b78;padding:7px 10px;cursor:pointer}details{margin-top:12px}summary{cursor:pointer;color:#006b78}footer{padding:0 24px 24px;font-size:12px;color:#607582;line-height:1.8}@media(max-width:1100px){.panels{grid-template-columns:1fr}.textbody{max-height:none}}@media(max-width:700px){header{padding:18px}.layout{grid-template-columns:1fr;padding:0 12px 20px}.list{height:220px;min-height:0}.stats{padding:12px}.stat{min-width:145px}svg{height:320px}}
</style></head>
<body><header><h1>深圳四区 · 学区边界与文字</h1><p>360 条官方地图路径与逐校文字｜整理于 2026-11-10，地图快照为 11 月 3—4 日<br>保留共同范围、相同范围和自交路径；独立政策原文与地图原文分列。</p><div class="toplinks"><a href="四区_polygon与文字.json" download>下载完整 JSON</a><a href="深圳四区_polygon与文字.zip" download>下载资料包 ZIP</a><a href="使用说明.txt">使用说明</a><a href="来源与哈希.json">来源清单</a><a href="来源线索索引.json">历史 / 草案线索</a></div></header>
<div id="stats" class="stats"></div><div class="layout"><aside class="sidebar"><div class="filters"><input id="query" type="search" placeholder="搜索学校、地名或文字" aria-label="搜索学校、地名或文字"><select id="district" aria-label="选择行政区"><option value="">全部四区</option><option>福田区</option><option>南山区</option><option>龙华区</option><option>龙岗区</option></select><select id="status" aria-label="筛选资料状态"><option value="">全部资料状态</option><option value="map_missing">地图文字缺失</option><option value="independent_missing">未直接配对独立文字</option><option value="candidate">有待核身份的文字候选</option><option value="invalid">自交路径（仍保留）</option><option value="override">另有查询覆盖层</option></select><div id="count" class="count" aria-live="polite"></div></div><div id="list" class="list"></div></aside>
<main class="details" id="detail"></main></div><footer>本包是现有资料整理，未生成新的 Gold。独立文字配对数含历史正式文件，不等于当年空间核验通过数。来源存档内旧版暂缓结论仅为历史记录，不作为本包删校规则。GeoJSON 保留原生 BD-09 坐标约定，不能按 WGS84 直接叠加底图。</footer>
<script id="payload" type="application/json">__DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('payload').textContent), all=data.records;
const $=id=>document.getElementById(id);let selected=all[0].school_id, shown=all;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
function link(text,url){const a=el('a',text);a.href=url;a.target='_blank';a.rel='noopener';return a;}
for(const s of data.summary){const box=el('div',undefined,'stat');box.append(el('b',s.schools),el('span',s.district),el('small',`地图文字 ${s.schools-s.map_text_missing} 条 · 独立文字已配对 ${s.with_independent_text} 校`));$('stats').append(box);}
function filter(){const q=$('query').value.trim().toLowerCase(),d=$('district').value,s=$('status').value;shown=all.filter(r=>(!d||r.district===d)&&(!q||[r.school_name,r.map_school_name,r.map_scope_text,...r.independent_texts.map(p=>p.scope_text),...r.candidate_policy_texts.map(p=>p.scope_text)].join(' ').toLowerCase().includes(q))&&(!s||(s==='map_missing'&&r.map_text_missing)||(s==='independent_missing'&&r.independent_text_missing)||(s==='candidate'&&r.candidate_policy_texts.length)||(s==='invalid'&&!r.geometry_valid)||(s==='override'&&r.alternate_query_boundary)));if(!shown.some(r=>r.school_id===selected))selected=shown[0]?.school_id;renderList();renderDetail();}
function renderList(){$('count').textContent=`显示 ${shown.length} / 360 条`;const root=$('list');root.replaceChildren();for(const r of shown){const b=el('button',undefined,'school'+(r.school_id===selected?' active':''));b.append(el('span',r.school_name),el('small',`${r.district} · ${r.vertex_count} 个顶点${r.map_text_missing?' · 地图文字缺失':''}`));b.setAttribute('aria-pressed',r.school_id===selected);b.onclick=()=>{selected=r.school_id;renderList();renderDetail();};root.append(b);}if(!shown.length)root.append(el('div','没有匹配记录，可清除搜索或调整筛选。','empty'));}
function download(r){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json;charset=utf-8'}));a.href=url;a.download=r.school_name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function addPolicy(parent,p,candidate=false){const sec=el('div',undefined,'section');sec.append(el('h4',`${candidate?'待确认身份 · ':''}${p.year} · ${p.school_name_raw}`),el('div',p.scope_text,'scope'),el('div',p.identity_status+'；'+p.applicability,'source'));const src=el('div',undefined,'source');src.append(link('官方原文',p.source_url),document.createTextNode(' · '+p.source_position));sec.append(src);parent.append(sec);}
function renderDetail(){const root=$('detail');root.replaceChildren();const r=all.find(x=>x.school_id===selected);if(!r){root.append(el('div','暂无学校可显示。','panel empty'));return;}
const heading=el('div',undefined,'heading');heading.append(el('h2',r.school_name),el('div',`地图原名：${r.map_school_name} ｜ ${r.district}`,'meta'),el('div',`学校 ID：${r.source_school_id} ｜ 快照：${r.snapshot_time}`,'meta'));const badges=el('div',undefined,'badges');for(const [t,w] of [[`${r.vertex_count} 顶点 / ${r.unique_vertex_count} 个不同点`,false],[r.geometry_valid?'有效简单面':'自交路径 · 完整保留',!r.geometry_valid],[r.map_text_missing?'地图原文缺失':'地图原文已收录',r.map_text_missing],[r.independent_text_missing?'独立文字待补 / 待配对':`独立文字 ${r.independent_texts.length} 条`,r.independent_text_missing]])badges.append(el('span',t,'badge'+(w?' warn':'')));heading.append(badges);root.append(heading);
const panels=el('div',undefined,'panels'),mapPanel=el('section',undefined,'panel');mapPanel.append(el('h3','官方原始路径 · 无底图示意'));const toolbar=el('div',undefined,'maptools');function toggle(id,text,checked){const l=el('label'),i=el('input');i.type='checkbox';i.id=id;i.checked=checked;i.onchange=()=>draw(r);l.append(i,document.createTextNode(text));toolbar.append(l);}toggle('neighbors','附近学校',true);toggle('vertices','顶点',false);if(r.alternate_query_boundary)toggle('override','查询覆盖层',true);mapPanel.append(toolbar);const box=el('div',undefined,'mapbox');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='map';svg.setAttribute('viewBox','0 0 800 560');svg.setAttribute('aria-label',r.school_name+'原始学区边界示意');svg.setAttribute('role','img');box.append(svg);mapPanel.append(box,el('div','绿色：本校原始绘图边界；灰色：附近学校；橙色虚线（如有）：官网另存查询覆盖层。SVG 奇偶填色仅供观察，不替代官网点落面判断。','caption'),el('div',r.crs_note,'caption'));panels.append(mapPanel);
const textPanel=el('section',undefined,'panel');textPanel.append(el('h3','逐校文字与来源'));const body=el('div',undefined,'textbody');const mapSec=el('div',undefined,'section');mapSec.append(el('h4','地图平台原文（XQ）'),el('div',r.map_scope_text||'【原始字段为空，未用政策文字替代】','scope'+(r.map_text_missing?' missing':'')));const src=el('div',undefined,'source');src.append(link('官方地图入口',r.map_source_url),document.createTextNode(' · '),link('包内源记录',r.source_archive));mapSec.append(src,el('div',`记录更新时间：${r.map_record_update_not_policy_year||'未提供'}（不作为政策适用年）`,'source'));body.append(mapSec);
body.append(el('h4','独立发布的政策文字'));if(!r.independent_texts.length)body.append(el('p','尚未直接配对独立正式范围文字。已有地图文字仍完整保留。','missing'));for(const p of r.independent_texts)addPolicy(body,p);if(r.candidate_policy_texts.length){body.append(el('h4','名称 / 校区对应尚待核实'));for(const p of r.candidate_policy_texts)addPolicy(body,p,true);}
if(r.source_leads.length){const details=el('details');details.append(el('summary',`更多历史或草案来源线索（${r.source_leads.length}）`));for(const p of r.source_leads){const sec=el('div',undefined,'section');sec.append(link(`${p.year} · ${p.title}`,p.url),el('div',p.status+'；'+p.use,'source'),el('p',p.detail));details.append(sec);}body.append(details);}textPanel.append(body);panels.append(textPanel);root.append(panels);
const notes=el('div',undefined,'notes');notes.append(el('strong','核对备注'));for(const note of r.notes)notes.append(el('div',note));notes.append(el('div','空间核验状态：'+r.polygon_vs_policy_status));root.append(notes);const downloads=el('div',undefined,'downloads');const b=el('button','下载本校 JSON');b.onclick=()=>download(r);downloads.append(b,link('本区逐校文字 TXT',`分区/${r.district}/逐校文字.txt`),link('本区 GeoJSON',`分区/${r.district}/原始边界_BD09_非RFC7946.geojson`));root.append(downloads);draw(r);}
function draw(r){const svg=$('map');svg.replaceChildren();const coords=r.vertices;let xmin=Math.min(...coords.map(v=>v[0])),xmax=Math.max(...coords.map(v=>v[0])),ymin=Math.min(...coords.map(v=>v[1])),ymax=Math.max(...coords.map(v=>v[1]));const alternate=r.alternate_query_boundary?.vertices;if(alternate&&$('override')?.checked){xmin=Math.min(xmin,...alternate.map(v=>v[0]));xmax=Math.max(xmax,...alternate.map(v=>v[0]));ymin=Math.min(ymin,...alternate.map(v=>v[1]));ymax=Math.max(ymax,...alternate.map(v=>v[1]));}const cos=Math.cos((ymax+ymin)/2*Math.PI/180),cx=(xmax+xmin)/2,cy=(ymax+ymin)/2,scale=Math.min(700/(Math.max(xmax-xmin,0.00001)*cos),470/Math.max(ymax-ymin,0.00001));const xy=v=>[400+(v[0]-cx)*cos*scale,280-(v[1]-cy)*scale];function path(v,stroke,fill,width,dash){const n=document.createElementNS(svg.namespaceURI,'path');n.setAttribute('d',v.map((p,i)=>(i?'L':'M')+xy(p).join(',')).join(' ')+'Z');n.setAttribute('fill',fill);n.setAttribute('fill-rule','evenodd');n.setAttribute('stroke',stroke);n.setAttribute('stroke-width',width);if(dash)n.setAttribute('stroke-dasharray',dash);svg.append(n);}if($('neighbors').checked)for(const n of all){if(n.district!==r.district||n.school_id===r.school_id)continue;path(n.vertices,'#cbd6dd','none',1);}path(coords,'#008877','#8fd1be66',2.5);if(alternate&&$('override')?.checked)path(alternate,'#d57b19','none',2.5,'8 5');if($('vertices').checked)for(const v of coords){const [x,y]=xy(v),c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',2.3);c.setAttribute('fill','#075b51');svg.append(c);}const label=document.createElementNS(svg.namespaceURI,'text');label.setAttribute('x',18);label.setAttribute('y',28);label.setAttribute('fill','#607582');label.setAttribute('font-size',14);label.textContent='北 ↑  · 原生坐标相对位置';svg.append(label);}
for(const id of ['query','district','status'])$(id).addEventListener(id==='query'?'input':'change',filter);filter();
</script></body></html>
