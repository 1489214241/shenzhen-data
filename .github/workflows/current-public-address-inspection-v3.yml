name: Current public address inspection v3
on:
  push:
    branches: ['chatgpt/k1-scope-experiment-v3']
    paths: ['.github/workflows/current-public-address-inspection-v3.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public official landing pages and bounded linked scripts
        run: |
          mkdir evidence
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,re,pathlib,hashlib,datetime
          out=pathlib.Path('evidence');receipts=[];assets=[]
          urls=['https://spatydz.sz.gov.cn/web/index.html','https://zjj.sz.gov.cn/SZFDCMAP2D/','https://zjj.sz.gov.cn/SZFDCMAP2D/szgeoapi/doc/index.html']
          for i,url in enumerate(urls):
            rec={'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (public geographic-data research)'})
              with urllib.request.urlopen(req,timeout=25) as res:raw=res.read(4000000);final=res.url;rec.update(status=res.status,final_url=final,content_type=res.headers.get('Content-Type'))
              text=raw.decode('utf-8',errors='replace');name=f'page_{i}.html';(out/name).write_bytes(raw);rec.update(file=name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
              for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',text,re.I):
                u=urllib.parse.urljoin(final,src)
                if urllib.parse.urlparse(u).hostname==urllib.parse.urlparse(final).hostname and not re.search('jquery|bootstrap|echarts|vendor|vue|react|moment|leaflet|openlayers',u,re.I):assets.append(u)
            except Exception as e:rec['error']=str(e)
            receipts.append(rec)
          for i,u in enumerate(dict.fromkeys(assets)):
            if i>=12:break
            rec={'url':u}
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as res:raw=res.read(5000000)
              name=f'linked_{i}.js';(out/name).write_bytes(raw);rec.update(file=name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
            except Exception as e:rec['error']=str(e)
            receipts.append(rec)
          (out/'receipt.json').write_text(json.dumps({'purpose':'Public geographical address metadata only. No login, bypass, personal records or school answers','created':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requests':receipts,'linked_scripts':assets},ensure_ascii=False,indent=2));print(json.dumps(receipts,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-public-address-inspection-v3
          path: evidence/
          retention-days: 7
          if-no-files-found: error
