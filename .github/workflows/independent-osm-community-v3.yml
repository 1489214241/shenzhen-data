name: Independent OSM community boundaries v3
on:
  push:
    branches: ['chatgpt/k1-scope-experiment-v3']
    paths: ['.github/workflows/independent-osm-community-v3.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch community administrative geometry only
        run: |
          mkdir evidence
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,datetime,pathlib
          out=pathlib.Path('evidence');receipt={'purpose':'Community administrative boundaries only; NO school catchments or enrollment labels','source':'OpenStreetMap contributors; not automatically official/verified','acquired':datetime.datetime.now(datetime.timezone.utc).isoformat(),'attempts':[],'success':False}
          query='[out:json][timeout:70];(relation["boundary"="administrative"]["admin_level"~"^(9|10|11|12)$"](22.53,113.93,22.91,114.48);way["boundary"="administrative"]["admin_level"~"^(9|10|11|12)$"](22.53,113.93,22.91,114.48);relation["boundary"="administrative"]["name"~"社区|居委"](22.53,113.93,22.91,114.48););out tags geom;'
          receipt['query']=query
          for endpoint in ['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter']:
            try:
              req=urllib.request.Request(endpoint+'?'+urllib.parse.urlencode({'data':query}),headers={'User-Agent':'SchoolCatchmentResearch/1.0'})
              with urllib.request.urlopen(req,timeout=95) as r:raw=r.read()
              data=json.loads(raw)
              if data.get('remark') or 'elements'not in data:raise ValueError(str(data.get('remark','invalid response')))
              (out/'communities_osm.json').write_bytes(raw);receipt.update(success=True,elements=len(data['elements']),sha256=hashlib.sha256(raw).hexdigest());break
            except Exception as e:receipt['attempts'].append({'endpoint':endpoint,'error':str(e)[:500]})
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2));print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-osm-community-v3
          path: evidence/
          retention-days: 7
          if-no-files-found: error
