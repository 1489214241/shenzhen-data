name: K1 source input snapshot
on:
  push:
    branches: ['chatgpt/k1-signed-evidence-20261114']
    paths: ['.github/workflows/k1-source-input-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 1489214241/school-zone-adaptation
          ref: fa1d1b10fd1d4a8b402598a5f5943dc257349029
          persist-credentials: false
      - name: Archive public input snapshot
        run: |
          mkdir -p transfer
          git rev-parse HEAD > transfer/source_commit.txt
          git archive --format=zip --output=transfer/school_zone_adaptation_fa1d1b10.zip HEAD
          find data -type f | sort > transfer/input_files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-inputs-fa1d1b10
          path: transfer/
          retention-days: 7
          if-no-files-found: error
